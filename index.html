<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#listings">
      <h1 class="brand-name">House Hunt</h1>
      <span class="brand-sub">Linden Park &amp; Glenunga zones</span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="#listings">Listings</a>
      <a href="#map">Map</a>
      <a href="#outlook">Outlook</a>
      <a href="#finance">Finance</a>
      <a href="#areas">Areas</a>
      <a href="#settings">Settings</a>
    </nav>
    <div class="topbar-tools">
      <span id="updated" class="updated">Loading…</span>
      <button id="fetch-btn" type="button" class="btn btn-primary">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-refresh"/></svg>
        <span>Fetch new listings</span>

    </div>

<main id="main" class="main">
  <div id="banner" class="banners"></div>
  <section id="macro" class="macro" aria-label="Key indicators"></section>

  <section id="view-listings" class="view" aria-label="Listings">
    <div class="listings-layout">
      <aside class="filters-aside">
        <button type="button" class="btn btn-secondary filters-toggle" aria-expanded="false" aria-controls="filters-panel" onclick="var p=document.getElementById('filters-panel');var o=p.classList.toggle('is-open');this.setAttribute('aria-expanded',o)">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
          <span>Filters &amp; preferences</span>
          <span id="filters-count" class="count" aria-label="active filters"></span>
        </button>
        <div id="filters-panel" class="filters-panel">
          <h2 class="section-title filters-title">Filters &amp; preferences</h2>
          <div id="filters-root"></div>
        </div>
      </aside>
      <div class="listings-main">
        <div id="listings-toolbar" class="toolbar"></div>
        <div id="listings-root" class="cards" aria-busy="true"></div>
      </div>
    </div>
  </section>

  <section id="view-map" class="view view-map" hidden aria-label="Map">
    <p id="map-status" class="muted small map-status" role="status"></p>
    <div id="map-canvas" class="map-canvas" aria-label="Map of the school zones and current listings"></div>
  </section>

  <section id="view-outlook" class="view" hidden aria-label="Outlook and news">
    <div id="outlook-root"></div>
  </section>

  <section id="view-finance" class="view" hidden aria-labelledby="h-finance">
    <h2 id="h-finance" class="section-title">Finance</h2>
    <div id="finance-root"></div>
  </section>

  <section id="view-areas" class="view" hidden aria-labelledby="h-areas">
    <h2 id="h-areas" class="section-title">Areas</h2>
    <div id="areas-root"></div>
  </section>

  <section id="view-settings" class="view" hidden aria-labelledby="h-settings">
    <h2 id="h-settings" class="section-title">Settings</h2>
    <div id="settings-root"></div>
  </section>

  <section id="view-more" class="view" hidden aria-labelledby="h-more">
    <h2 id="h-more" class="section-title">More</h2>
    <div id="more-root"></div>
  </section>
</main>
