name: Fetch data

on:
  workflow_dispatch:
  schedule:
    # ~7:30am and ~6:30pm Adelaide time (ACDT UTC+10:30 / ACST UTC+9:30)
    - cron: "0 21 * * *"
    - cron: "0 8 * * *"
  push:
    paths:
      - data/areas.json

permissions:
  contents: write
  models: read

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test scripts/*.test.mjs
      - name: Fetch data
        run: node scripts/fetch.mjs
        env:
          DOMAIN_CLIENT_ID: ${{ secrets.DOMAIN_CLIENT_ID }}
          DOMAIN_CLIENT_SECRET: ${{ secrets.DOMAIN_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-timesfm.txt
      - name: TimesFM forecast (optional)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install -r scripts/requirements-timesfm.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python scripts/timesfm_forecast.py
      - name: Blend forecasts
        run: node scripts/fetch.mjs --blend-only
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
